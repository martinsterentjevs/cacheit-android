name: CI — cacheit-android

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon

      # Business logic doesn't vary by flavor — only BASE_URL/WS_URL do — so
      # one flavor's unit tests is enough for the PR gate rather than
      # running all three redundantly.
      - name: Unit tests (staging flavor)
        run: ./gradlew testStagingDebugUnitTest --no-daemon

      # Instrumented tests deliberately excluded here — emulator/device
      # runner cost doesn't belong in a blocking PR gate. Stay manual
      # pre-release per the original CI Readiness sequencing.

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
